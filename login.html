<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – Sistem Ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:#0b0f1a;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;animation:float 8s ease-in-out infinite}
.blob1{width:400px;height:400px;background:#6366f1;top:-100px;left:-100px;animation-delay:0s}
.blob2{width:300px;height:300px;background:#8b5cf6;bottom:-80px;right:-80px;animation-delay:3s}
.blob3{width:200px;height:200px;background:#06b6d4;top:50%;left:50%;animation-delay:5s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.card{position:relative;z-index:1;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;box-shadow:0 8px 32px rgba(99,102,241,.4)}
.logo h1{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
.logo p{font-size:14px;color:rgba(255,255,255,.5)}
.form-group{margin-bottom:20px}
label{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.7);margin-bottom:8px}
.input-wrap{position:relative}
input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;color:#fff;font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:all .3s}
input::placeholder{color:rgba(255,255,255,.3)}
input:focus{border-color:#6366f1;background:rgba(99,102,241,.1);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:18px;padding:4px;transition:color .2s}
.toggle-pw:hover{color:#fff}
.btn-login{width:100%;padding:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .3s;margin-top:8px;position:relative;overflow:hidden}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,.5)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-login .spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:13px;margin-bottom:16px;display:none;align-items:center;gap:8px}
.error-box.show{display:flex}
.info-box{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);border-radius:10px;padding:12px 16px;margin-top:24px;font-size:12px;color:rgba(255,255,255,.5)}
.info-box span{display:block;margin-bottom:2px}
.info-box b{color:rgba(255,255,255,.8)}
</style>
</head>
<body>
<div class="bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <h1>Sistem Ronda</h1>
    <p>Masuk untuk melanjutkan</p>
  </div>

  <div class="error-box" id="errBox">
    <span>⚠</span><span id="errMsg"></span>
  </div>

  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Masukkan username" autocomplete="username">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
      <button class="toggle-pw" onclick="togglePw()" type="button" id="eyeBtn">👁</button>
    </div>
  </div>

  <button class="btn-login" id="btnLogin" onclick="doLogin()">
    <span id="btnText">Masuk</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="info-box">
    <span>🔑 Akun default:</span>
    <span><b>admin</b> / admin123 &nbsp;•&nbsp; <b>petugas</b> / ronda123</span>
  </div>
  <div style="text-align:center;margin-top:16px">
    <a href="petugas.html" style="font-size:13px;color:rgba(99,102,241,.8);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;border:1px solid rgba(99,102,241,.2);transition:all .2s" onmouseover="this.style.background='rgba(99,102,241,.1)'" onmouseout="this.style.background='none'">
      🛡️ Masuk sebagai Petugas Ronda (tanpa password admin)
    </a>
  </div>
</div>

<script src="app.js"></script>
<script>
// Jika sudah login, redirect ke dashboard
window.addEventListener('DOMContentLoaded', () => {
  if (Auth.ok()) window.location.href = 'index.html';
  document.getElementById('username').focus();
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
});

function togglePw() {
  const inp = document.getElementById('password');
  const btn = document.getElementById('eyeBtn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

function showErr(msg) {
  const box = document.getElementById('errBox');
  document.getElementById('errMsg').textContent = msg;
  box.classList.add('show');
}

function hideErr() { document.getElementById('errBox').classList.remove('show'); }

async function doLogin() {
  hideErr();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { showErr('Username dan password harus diisi.'); return; }

  const btn = document.getElementById('btnLogin');
  const txt = document.getElementById('btnText');
  const spin = document.getElementById('spinner');
  btn.disabled = true; txt.style.display = 'none'; spin.style.display = 'block';

  await new Promise(r => setTimeout(r, 600));
  try {
    Auth.login(username, password);
    window.location.href = 'index.html';
  } catch (e) {
    showErr(e.message);
    btn.disabled = false; txt.style.display = 'block'; spin.style.display = 'none';
  }
}
</script>
</body>
</html>
